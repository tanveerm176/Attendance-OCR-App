# ci.yml should trigger on every push to main and every pull request to main. Its steps are:

# Checkout code
# Set up Python (match whatever version you're developing on)
# Install dependencies via pip install -r requirements.txt
# Run pytest

name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
        - name: Checkout code
          uses: actions/checkout@v4
          
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.14"

        - name: Install Tesseract
          run: sudo apt-get install -y tesseract-ocr

        - name: Install dependencies
          run: pip install -r requirements.txt

        - name: Run tests
          run: pytest tests/ -v

